[package]
name = "wish_cli"
description = "`wen`, the Wish Engine command-line tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wen"
path = "src/main.rs"

# What a person starts (the desktop shortcut): `wen edit` without a console
# window. Only the standard library.
[[bin]]
name = "wish-engine"
path = "src/launcher.rs"

[dependencies]
serde_json.workspace = true
wish_app.workspace = true
wish_asset.workspace = true
wish_control.workspace = true
wish_audio.workspace = true
wish_mcp.workspace = true
wish_net.workspace = true
wish_core.workspace = true
wish_ecs.workspace = true
wish_editor.workspace = true
wish_examples.workspace = true
wish_import.workspace = true
wish_player.workspace = true
wish_render.workspace = true
wish_scene.workspace = true
wish_schema.workspace = true
wish_script.workspace = true
wish_transform.workspace = true
wish_window.workspace = true

[dev-dependencies]
serde_json.workspace = true

# Sound out of the speakers (`wen play`): Windows and Linux (ALSA, so a Linux
# build needs libasound2-dev and the program needs libasound.so.2). macOS
# comes with its package (CoreAudio).
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
wish_audio = { workspace = true, features = ["output"] }

[lints]
workspace = true
