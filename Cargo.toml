[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# External crates. Check the license before adding one (see deny.toml).
# Workspace crates are added here as soon as another crate depends on them.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[workspace.lints.rust]
# `unsafe` is allowed only in the crates listed in CLAUDE.md, which opt in locally.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# Library code never panics: failures are returned as `Diagnostic`.
# Tests are exempt (see clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Determinism: iterating a hash map or hash set has no stable order.
iter_over_hash_type = "deny"
