[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Workspace crates. A crate is listed once another crate depends on it.
wish_app = { path = "crates/wish_app" }
wish_asset = { path = "crates/wish_asset" }
wish_core = { path = "crates/wish_core" }
wish_ecs = { path = "crates/wish_ecs" }
wish_examples = { path = "crates/wish_examples" }
wish_import = { path = "crates/wish_import" }
wish_render = { path = "crates/wish_render" }
wish_scene = { path = "crates/wish_scene" }
wish_schema = { path = "crates/wish_schema" }
wish_transform = { path = "crates/wish_transform" }
wish_control = { path = "crates/wish_control" }
wish_mcp = { path = "crates/wish_mcp" }
wish_agent = { path = "crates/wish_agent" }
wish_player = { path = "crates/wish_player" }
wish_window = { path = "crates/wish_window" }
wish_schema_macros = { path = "crates/wish_schema_macros" }
wish_types = { path = "crates/wish_types" }
wish_sdk = { path = "crates/wish_sdk" }
wish_sdk_macros = { path = "crates/wish_sdk_macros" }
wish_script = { path = "crates/wish_script" }
wish_input = { path = "crates/wish_input" }
wish_anim = { path = "crates/wish_anim" }
wish_audio = { path = "crates/wish_audio" }
wish_particles = { path = "crates/wish_particles" }
wish_physics = { path = "crates/wish_physics" }
wish_text = { path = "crates/wish_text" }
wish_ui = { path = "crates/wish_ui" }
wish_editor = { path = "crates/wish_editor" }
wish_net = { path = "crates/wish_net" }
wish_replicate = { path = "crates/wish_replicate" }
wish_sight = { path = "crates/wish_sight" }

# External crates. Check the license before adding one (see deny.toml).
#
# glam: `scalar-math` turns SIMD off so that Quat, Vec4 and Mat4 are plain f32
# structs with alignment 4 (SIMD variants are 16-aligned and would put padding
# into components). `libm` takes trigonometry from pure Rust instead of the
# platform's C library, for cross-platform determinism (ADR-005).
glam = { version = "0.34", features = ["scalar-math", "libm"] }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: parse floats exactly. The default parser can be one unit
# in the last place off, which would break bit-exact save/load of f64 fields.
serde_json = { version = "1", features = ["float_roundtrip"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Rendering (wish_render only, ADR-012). `wgpu` is the only graphics API the
# engine talks to; `naga` turns shader errors into positioned diagnostics.
# glTF reading (wish_import only). Supported extensions are the features
# named here; any other extension a file requires is reported as a warning.
gltf = { version = "1.4", features = ["KHR_materials_emissive_strength"] }
naga = { version = "30", features = ["wgsl-in"] }
png = "0.18"
# egui: immediate-mode editor UI (ADR-018). No default features: the bundled
# fonts carry OFL/Ubuntu licenses; the editor uses the engine's Roboto.
egui = { version = "0.37", default-features = false }
pollster = "1"
wgpu = "30"

# Window (wish_window only). winit opens the window and delivers input;
# softbuffer puts the finished picture on it (the renderer draws offscreen).
arboard = { version = "3", default-features = false }
softbuffer = "0.4"
vello_cpu = { version = "0.2.0", default-features = false, features = ["std", "u8_pipeline"] }
winit = "0.30"

# Game logic (wish_script only, ADR-011). Only what running core modules
# needs: no WASI, no component model, no async, no on-disk cache. Fuel makes
# runaway guests stop deterministically; `backtrace` + `addr2line` turn a trap
# into the guest's own function name, file and line.
wasmtime = { version = "=50.0.1", default-features = false, features = [
    "runtime",
    "cranelift",
    "std",
    "backtrace",
    "addr2line",
    "demangle",
    "pooling-allocator",
] }
# WebAssembly text format, for hand-written hostile guests in tests.
wat = "1"

# Physics (wish_physics only, ADR-014). Apache-2.0. Features: only the 3D f32
# engine with `enhanced-determinism` (no SIMD, no threads).
rapier3d = { version = "0.36", default-features = false, features = ["dim3", "f32", "std", "enhanced-determinism"] }

# Sound (wish_audio only, ADR-015). `hound` (WAV, Apache-2.0) and `lewton`
# (Ogg Vorbis, MIT/Apache-2.0) decode clips; `cpal` (Apache-2.0) reaches the
# sound card and wish_audio mixes. Kira was the plan, but it depends on
# MPL-2.0 code (symphonia, triple_buffer), which this project does not take.
# cpal: sound output, default features (JACK, PipeWire, ASIO) off.
cpal = { version = "0.18", default-features = false }
hound = "3.5"
lewton = "0.10"

# In-game interface. `taffy` (MIT, wish_ui only) lays boxes out like CSS
# flexbox; only the flexbox and block algorithms. `ab_glyph` (Apache-2.0,
# wish_text only) reads fonts, measures and rasterizes glyphs.
taffy = { version = "0.15", default-features = false, features = ["std", "taffy_tree", "flexbox", "block_layout", "content_size"] }
ab_glyph = "0.2.32"

# Release archives (wish_control::archive): deflate and gzip from `flate2`
# (MIT OR Apache-2.0, already in the tree through png), SHA-256 from `sha2`
# (MIT OR Apache-2.0, already in the tree through Cranelift). Zip, tar and
# the checksum list are the engine's own code.
flate2 = "1"
sha2 = { version = "0.10", default-features = false }

# Online play (wish_net only, ADR-029). RustCrypto's ChaCha20-Poly1305
# (Apache-2.0 OR MIT; chacha20 is already in the tree through rand) seals
# every data packet; x25519-dalek (BSD-3-Clause) agrees the keys, with
# `static_secrets` so a host keeps one key pair per match and `zeroize` so
# secrets are wiped when dropped. getrandom (MIT OR Apache-2.0, already in
# the tree) gives the operating system's randomness. Key derivation is
# SHA-256 (sha2 above). Audited, pure Rust, no runtime, no clock.
chacha20poly1305 = { version = "0.11", default-features = false }
getrandom = "0.4"
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"] }

# Procedural macros. syn 3, the same major version serde_derive uses, so the
# build compiles one syn.
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }

# Tests only.
proptest = "1"
# Compile-fail tests: the macros' error messages are part of the interface.
trybuild = "1.0.123"

# Debug builds: full debug information for the engine's own crates only.
# Dependencies get line tables (backtraces stay readable). wasmtime is linked
# into every test binary of the crates above wish_script; with full debug
# information each one weighed about a gigabyte and the build folder grew by
# tens of gigabytes (M5 WP3, the disk filled up).
[profile.dev.package."*"]
debug = "line-tables-only"

# The programs a release ships (`cargo build --profile dist`; the release
# workflow, docs/design/M12-release-pipeline.md). Release, with link-time
# optimization across crates (thin: fat LTO of wen on a 4-core runner costs
# far more time and memory). Unwinding stays on: hostile files are read under
# catch_unwind and the crash report needs the panic. Symbol names stay, so a
# crash report's backtrace names functions on Linux. The static C runtime of
# the Windows programs is a RUSTFLAGS setting (a profile cannot set it).
[profile.dist]
inherits = "release"
lto = "thin"
strip = "debuginfo"

[workspace.lints.rust]
# `unsafe` is allowed only in the crates listed in CLAUDE.md, which opt in locally.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# Library code never panics: failures are returned as `Diagnostic`.
# Tests are exempt (see clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Determinism: iterating a hash map or hash set has no stable order.
iter_over_hash_type = "deny"
# Every unsafe block and unsafe impl says why it is sound.
undocumented_unsafe_blocks = "deny"
