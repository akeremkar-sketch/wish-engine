name: CI

on:
  push:
    # main, and milestone branches (m3-render, …) so problems show before merging.
    branches: [main, "m[0-9]*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Rendering tests use the software adapter: WARP ships with Windows;
      # on Linux it is Mesa's lavapipe (Vulkan on the CPU).
      - name: Install the software Vulkan driver
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Release builds turn wgpu's debug layer off, which changes how drivers
      # behave (M3 WP3: a tone-mapping shader lost the WARP device only in
      # release). Rendering is tested both ways.
      - name: Rendering tests in release
        run: cargo test --release --locked -p wish_render
      # What the rendering tests drew, for comparing platforms and for
      # inspecting a failed golden-image test.
      - name: Keep rendered images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-${{ matrix.os }}
          path: target/tmp/captures/
          if-no-files-found: ignore

  licenses:
    name: dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources
