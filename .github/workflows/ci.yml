name: CI

on:
  push:
    # main, and milestone branches (m3-render, …) so problems show before merging.
    branches: [main, "m[0-9]*"]
  pull_request:

# Read-only: CI never writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The Linux runner has about 14 GB free; the build (wasmtime, Rapier,
      # wgpu, every test binary) plus the cache save did not fit (M6 WP2).
      # Remove preinstalled toolchains this project never uses.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      # Rendering tests use the software adapter: WARP ships with Windows;
      # on Linux it is Mesa's lavapipe (Vulkan on the CPU). Sound output
      # (wen play, the player) links ALSA on Linux: its headers and
      # pkg-config are needed to build.
      - name: Install the software Vulkan driver and the ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libasound2-dev pkg-config
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Release builds turn wgpu's debug layer off, which changes how drivers
      # behave (M3 WP3: a tone-mapping shader lost the WARP device only in
      # release). Rendering is tested both ways.
      - name: Rendering tests in release
        run: cargo test --release --locked -p wish_render
      # ADR-023/ADR-025: a packed copy of the compiler alone (no cargo,
      # rustup or linker in its environment) builds game code that runs.
      - name: Game code builds with the packed toolchain
        run: cargo test --locked -p wish_script --test toolchain -- --ignored --nocapture
      # What the rendering tests drew, for comparing platforms and for
      # inspecting a failed golden-image test.
      - name: Keep rendered images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: captures-${{ matrix.os }}
          path: target/tmp/captures/
          if-no-files-found: ignore

  licenses:
    name: dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2
        with:
          command: check licenses sources
